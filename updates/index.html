<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Updates on Lukas · Christoforakis</title>
  <meta name="description" content="Updates from the Christoforakis family about Lukas’s hospitalization, lung transplant, recovery, and life at home." />
  <meta name="theme-color" content="#f8f7ed" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="canonical" href="https://christoforakis.com/updates/" />
  <meta property="og:title" content="Updates on Lukas" />
  <meta property="og:description" content="Updates from the Christoforakis family about Lukas’s transplant and recovery." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://christoforakis.com/updates/" />
  <meta property="og:image" content="https://christoforakis.com/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/site.css" />
  <script src="/assets/js/site.js" defer></script>
  <script src="/assets/js/updates.js" defer></script>
</head>
<body>
  <div data-site-header></div>
  <main id="main">
    <header class="updates-header shell">
      <div class="reveal">
        <p class="mono-label">Family updates · Lukas</p>
        <h1 class="display-title">The long way home.</h1>
      </div>
      <div class="reveal">
        <p class="lead">The family’s updates on Lukas’s illness, double lung transplant, recovery, and the ordinary days we are grateful to have now.</p>
        <div class="updates-tools">
          <label class="visually-hidden" for="updates-search">Search updates</label>
          <input class="search-field" id="updates-search" type="search" placeholder="Search the updates" autocomplete="off" data-updates-search />
        </div>
        <p class="mono-label" data-updates-status aria-live="polite">Loading updates…</p>
      </div>
    </header>

    <section class="reading-shell updates-feed" data-updates-feed aria-label="Updates on Lukas"></section>
    <section class="reading-shell" data-updates-empty hidden>
      <div class="empty-state">
        <div>
          <span class="empty-state__mark" aria-hidden="true"></span>
          <h2>No update matches that search.</h2>
          <p>Try a different word or clear the search field.</p>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
