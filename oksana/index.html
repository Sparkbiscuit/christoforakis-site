  <style>
    :root {
      --page-bg: #ece7de; --page-ink: #1e2330; --chrome-ink: #1e2330; --chrome-shadow: none; --chrome-bg: rgba(236, 231, 222, 0.82); --footer-ink: rgba(30, 35, 48, 0.62);
      --prussian: #17345f; --didone: "Bodoni Moda", "Didot", Georgia, serif; --text: "Newsreader", Georgia, serif;
    }
    body { background: #ece7de; }
    ::selection { background: #17345f; color: #f6f2e9; }

    /* One sheet: the words on the left, the print pinned beside them the whole way down. */
    .studio { --ph: min(calc(100svh - 170px), 900px); --pin: calc((100svh - var(--ph)) / 2 + 24px); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(32px, 6vw, 110px); padding: 0 clamp(16px, 5vw, 88px); }
    .studio__col { min-width: 0; }
    .studio__copy { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; min-height: 100svh; max-width: 560px; padding: 110px 0 64px; }
    .studio h1 { margin: 0; font: 400 clamp(54px, 7.4vw, 118px) / 0.94 var(--didone); font-optical-sizing: auto; letter-spacing: -0.015em; color: #1e2330; }
    .studio p { margin: 30px 0 0; max-width: 430px; font: 400 21px / 1.55 var(--text); color: #3b4150; }
    .studio a { display: inline-block; margin-top: 30px; font: italic 400 19px / 1.3 var(--text); color: var(--prussian); text-decoration: none; border-bottom: 1px solid rgba(23, 52, 95, 0.35); }
    .studio a:hover { border-bottom-color: currentColor; }
    .print { position: sticky; top: var(--pin); align-self: start; height: var(--ph); aspect-ratio: 4 / 5; margin: var(--pin) 0 8vh; }
    .print canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: pan-y; }

    /* The notebook */
    .notes { max-width: 640px; padding: 0 0 14vh; }
    .note { padding: 52px 0 60px; border-top: 1px solid rgba(30, 35, 48, 0.18); scroll-margin-top: 90px; }
    .note__image { display: block; width: 100%; height: auto; margin-bottom: 28px; border-radius: 2px; }
    .note time { display: block; margin-bottom: 12px; font: 500 15px / 1.4 var(--text); font-variant: small-caps; letter-spacing: 0.04em; color: #6a6f7c; }
    .note h2 { margin: 0 0 22px; font: 400 clamp(34px, 3.6vw, 50px) / 1.08 var(--didone); letter-spacing: -0.01em; color: #1e2330; }
    .note__copy p { margin: 0 0 1em; font: 400 21px / 1.66 var(--text); color: #2b303d; hanging-punctuation: first; }
    .note__copy p:first-child::first-letter { float: left; margin: 0.08em 0.1em 0 0; font: 400 3.6em / 0.78 var(--didone); color: var(--prussian); }
    .note__source { margin: 8px 0 0; font: italic 400 17px / 1.4 var(--text); color: #5d6270; }
    .note__source a { color: var(--prussian); }
    .note-state { max-width: 640px; margin: 0 auto; padding: 40px 0 80px; text-align: center; font-family: var(--text); }
    .note-state h2 { margin: 0 0 10px; font: 400 32px / 1.1 var(--didone); }
    .note-state button { margin-top: 14px; padding: 10px 18px; border: 1px solid #1e2330; border-radius: 2px; background: none; cursor: pointer; font: 500 15px var(--text); }

    @media (max-width: 960px), (max-aspect-ratio: 1/1) {
      .studio { display: flex; flex-direction: column; gap: 0; }
      .studio__col { display: contents; }
      .studio__copy { order: 1; min-height: 0; padding: 104px 0 36px; }
      .print { order: 2; position: relative; top: auto; height: auto; margin: 0 auto 24px; width: min(100%, 620px, calc((100svh - 60px) * 0.8)); }
      .notes { order: 3; }
      .note { padding: 40px 0 48px; }
      .note__copy p { font-size: 19px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="isl-chrome" data-isl-chrome></div>
  <noscript><p style="padding: 90px 24px 0"><a href="/">Home</a> · <a href="/updates/">Updates</a></p></noscript>

  <main id="main">
    <div class="studio">
      <div class="studio__col">
        <header class="studio__copy">
          <h1>Notes from Oksana.</h1>
          <p>A place for photographs and words from a financial analyst, a mom, and the person living the days behind both titles.</p>
          <a href="#notebook">Read the notebook</a>
          <p class="visually-hidden" data-blog-status aria-live="polite"></p>
        </header>

        <section class="notes" id="notebook" data-blog-feed aria-label="Oksana’s notes"></section>
        <noscript><p class="notes">Enable JavaScript to load the notebook. You can also visit the <a href="/">family home</a>.</p></noscript>
        <section class="notes" data-blog-error hidden>
          <div class="note-state">
            <h2>The notebook couldn’t be loaded.</h2>
            <p>Check your connection and try again.</p>
            <button type="button" data-blog-retry>Try again</button>
          </div>
        </section>
        <section class="notes" data-blog-empty hidden>
          <div class="note-state">
            <h2>The first note is still to come.</h2>
          </div>
        </section>
      </div>

      <figure class="print">
        <canvas data-print width="800" height="1000" role="img" aria-label="A cyanotype of pressed plants, a fern, Queen Anne’s lace, a grass and a leafy sprig, white on deep blue, in a shallow tray of water"></canvas>
      </figure>
    </div>
  </main>

  <div data-isl-footer></div>
</body>
